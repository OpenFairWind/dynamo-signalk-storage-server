<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><title>Settings | DYNAMO</title></head><body class="bg-dark text-light"><main class="container py-5"><h1>Settings</h1><form method="post" class="card bg-body-tertiary"><div class="card-body"><h2 class="h4">SMTP</h2><input class="form-control mb-2" name="smtp_host" value="{{settings.smtp_host}}" placeholder="SMTP host"><input class="form-control mb-2" name="smtp_port" value="{{settings.smtp_port}}" placeholder="SMTP port"><input class="form-control mb-3" name="smtp_sender" value="{{settings.smtp_sender}}" placeholder="Sender email"><h2 class="h4">OAuth identity providers</h2><textarea class="form-control mb-2" name="oauth_providers" placeholder="Provider names or JSON configuration">{{settings.oauth_providers}}</textarea><input class="form-control mb-2" name="oauth_client_id" value="{{settings.oauth_client_id}}" placeholder="Client ID"><input class="form-control mb-3" type="password" name="oauth_client_secret" value="{{settings.oauth_client_secret}}" placeholder="Client secret"><button class="btn btn-primary">Save settings</button></div></form></main></body></html>
