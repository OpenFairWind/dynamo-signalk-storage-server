<!doctype html><html lang="en" data-bs-theme="dark"><head><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/ol@10.8.0/ol.css" rel="stylesheet"><title>Vessel dashboard | DYNAMO</title><style>#map{height:65vh}</style></head><body class="bg-dark text-light"><main class="container py-4"><h1>Vessel data dashboard</h1>{% if authenticated %}<div class="row g-2 mb-3"><div class="col-md"><label>From<input id="start" class="form-control" type="datetime-local"></label></div><div class="col-md"><label>To<input id="end" class="form-control" type="datetime-local"></label></div><div class="col-md align-self-end"><button id="load" class="btn btn-primary">Load tracks</button></div></div>{% else %}<p class="text-secondary">Sign in to browse your vessels. Anonymous visitors see only aggregate vessel-density data.</p>{% endif %}<div id="map" class="rounded border"></div></main><script src="https://cdn.jsdelivr.net/npm/ol@10.8.0/dist/ol.js"></script><script>const map=new ol.Map({target:'map',layers:[new ol.layer.Tile({source:new ol.source.OSM()})],view:new ol.View({center:ol.proj.fromLonLat([0,20]),zoom:2})}),source=new ol.source.Vector(),layer=new ol.layer.Vector({source});map.addLayer(layer);const point=(p,n)=>new ol.Feature({geometry:new ol.geom.Point(ol.proj.fromLonLat([p.lon,p.lat])),name:n});async function heat(){let d=await fetch('/api/dashboard/heatmap').then(r=>r.json());source.clear();d.forEach(p=>source.addFeature(point(p,'')))}async function tracks(){let q=new URLSearchParams({start:document.querySelector('#start').value||'1970-01-01',end:document.querySelector('#end').value||'9999-12-31'});let d=await fetch('/api/dashboard/tracks?'+q).then(r=>r.json());source.clear();d.forEach(v=>v.positions.forEach(p=>source.addFeature(point(p,v.name))))} {% if authenticated %}document.querySelector('#load').onclick=tracks;tracks(){% else %}heat(){% endif %}</script></body></html>
