<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><title>Sign in | DYNAMO</title></head><body class="bg-dark text-light"><main class="container py-5"><div class="col-md-5 mx-auto card bg-body-tertiary"><div class="card-body p-4"><h1 class="h3">Sign in</h1>{% for c,m in get_flashed_messages(with_categories=true) %}<div class="alert alert-{{c}}">{{m}}</div>{% endfor %}<form method="post"><label class="form-label">Username</label><input class="form-control mb-3" name="username" required><label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" required><button class="btn btn-primary w-100">Sign in</button></form></div></div></main></body></html>
