<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><title>Administration | DYNAMO</title></head><body class="bg-dark text-light"><main class="container py-5"><h1>Administration</h1><div class="card bg-body-tertiary mb-3"><div class="card-body"><h2 class="h4">Registration</h2><form method="post" action="/admin/registration"><div class="form-check"><input class="form-check-input" type="checkbox" name="open" id="open" {% if registration_open %}checked{% endif %}><label class="form-check-label" for="open">Allow public self-registration</label></div><button class="btn btn-primary mt-3">Save policy</button></form></div></div><div class="card bg-body-tertiary"><div class="card-body"><h2 class="h4">Groups</h2><form method="post" class="input-group mb-3"><input class="form-control" name="name" placeholder="New group name" required><button class="btn btn-primary">Create</button></form><ul>{% for group in groups %}<li>{{ group.name }}</li>{% else %}<li class="text-secondary">No groups yet.</li>{% endfor %}</ul></div></div></main></body></html>
