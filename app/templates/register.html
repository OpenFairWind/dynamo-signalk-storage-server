<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><title>Register | DYNAMO</title></head><body class="bg-dark text-light"><main class="container py-5"><div class="col-md-5 mx-auto card bg-body-tertiary"><div class="card-body p-4">{% if step == 2 %}<h1 class="h3">Complete registration</h1><p class="text-secondary">{{ email }}</p><form method="post"><input class="form-control mb-3" name="username" placeholder="Username" required><input class="form-control mb-3" type="password" name="password" placeholder="Password (12+ characters)" minlength="12" required><button class="btn btn-primary w-100">Create account</button></form>{% else %}<h1 class="h3">Register</h1><p class="text-secondary">We will send a one-time registration link.</p><form method="post"><input class="form-control mb-3" type="email" name="email" placeholder="Email address" required><button class="btn btn-primary w-100">Send link</button></form>{% endif %}</div></div></main></body></html>
